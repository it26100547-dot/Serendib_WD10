<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Package Details | Serendib</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head><body class="global-video-page"><video class="global-bg-video" autoplay muted loop playsinline aria-hidden="true"><source src="V2.mp4" type="video/mp4"></video><div class="global-bg-overlay" aria-hidden="true"></div><div id="siteHeader"></div><main id="detailRoot"><section class="section"><div class="container"><div class="notice">Loading package...</div></div></section></main><div id="siteFooter"></div><script src="js/data.js"></script><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/booking-ui.js"></script><script>
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const listHtml=(arr,empty='Not specified')=>(arr&&arr.length)?`<ul class="detail-list">${arr.map(x=>`<li>${safe(x)}</li>`).join('')}</ul>`:`<p>${empty}</p>`;
async function loadPackage(){
  const id=qs('id'); let p;
  try{p=(await SerendibApi.packages.getById(id)).data;}catch(e){p=DATA.packages.find(x=>x.id==id)||DATA.packages[0];}
  if(!p){document.getElementById('detailRoot').innerHTML='<section class="section"><div class="container"><div class="notice error">Package not found.</div></div></section>';return;}
  document.title=`${p.name} | Serendib`;
  const imgs=[p.cover||p.image,...(p.images||[])].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).slice(0,5); while(imgs.length<3)imgs.push(imgs[0]||'assets/images/hero-sigiriya-gardens.jpg');
  const itinerary=(p.itinerary||[]).map((d,i)=>`<div class="day"><div class="day-num"><span>DAY</span><strong>${i+1}</strong></div><div class="day-content"><h3>${safe(Array.isArray(d)?d[0]:d.title)}</h3><p>${safe(Array.isArray(d)?d[1]:d.description)}</p></div></div>`).join('');
  document.getElementById('detailRoot').innerHTML=`
  <section class="detail-hero"><div class="detail-gallery">${imgs.map((im,i)=>`<img class="${i===0?'main':''}" src="${safe(im)}" alt="${safe(p.name)}">`).join('')}</div><div class="detail-summary"><span class="eyebrow">${safe(p.category||'Tour package')}</span><h1>${safe(p.name)}</h1><p>${safe(p.description||p.summary||'')}</p><div class="summary-box"><div class="summary-item"><span>DURATION</span><strong>${safe(p.days||1)} days / ${safe(p.nights||0)} nights</strong></div><div class="summary-item"><span>PRICE</span><strong>${money(p.price)} ${safe(p.priceUnit||'per person')}</strong></div><div class="summary-item"><span>RATING</span><strong>★ ${safe(p.rating||'-')}</strong></div><div class="summary-item"><span>SAVING</span><strong>${p.normalPrice>p.price?money(p.normalPrice-p.price):'—'}</strong></div></div></div></section>
  <section class="section"><div class="container detail-grid"><div>
    <div class="panel"><h2>Package route</h2><p class="route-line">${safe(p.route||((p.destinations||[]).join(' → '))||'Route is customized by the administrator.')}</p></div>
    <div class="panel" style="margin-top:20px"><h2>Day-by-day itinerary</h2>${itinerary||'<p>No itinerary added yet.</p>'}</div>
    <div class="two-detail-panels"><div class="panel"><h3>Highlights</h3>${listHtml(p.highlights||p.destinations||[])}</div><div class="panel"><h3>Included</h3>${listHtml(p.inclusions||[])}</div></div>
    <div class="two-detail-panels"><div class="panel"><h3>Not included</h3>${listHtml(p.exclusions||[])}</div><div class="panel"><h3>Booking information</h3><p><strong>Meeting point:</strong> ${safe(p.meetingPoint||'Will be confirmed after booking.')}</p><p style="margin-top:10px"><strong>Cancellation:</strong> ${safe(p.cancellationPolicy||'Contact Serendib for cancellation terms.')}</p><p style="margin-top:10px">${safe(p.bookingNote||'')}</p></div></div>
    <div class="panel" style="margin-top:20px"><h2>Connected services</h2><div class="info-list"><div><span>Transport</span><strong>${p.transportId?`<a href="vehicle-details.html?id=${p.transportId}">${safe(p.transportName||'View vehicle')}</a>`:safe(p.transportName||'Not specified')}</strong></div><div><span>Hotel</span><strong>${p.hotelId?`<a href="hotel-details.html?id=${p.hotelId}">${safe(p.hotelName||'View hotel')}</a>`:safe(p.hotelName||'Not specified')}</strong></div></div></div>
  </div><aside><form class="panel sticky booking-panel" id="packageBooking"><h3>Book this package</h3><div class="price">${money(p.price)} <small>${safe(p.priceUnit||'per person')}</small></div><div class="field"><label>START DATE</label><input id="pkgDate" type="date" required></div><div class="field"><label>TRAVELERS</label><input id="pkgGuests" type="number" min="1" value="1" required></div><div class="field"><label>REQUEST / NOTE</label><textarea id="pkgNote" placeholder="Airport pickup, dietary requests..."></textarea></div>${SerendibBookingUI.paymentFields('pkgPay')}<button class="btn btn-primary" style="width:100%;margin-top:15px" type="submit">Create booking & submit payment</button><div class="notice" id="pkgMsg">Login is required to place a booking. Admin confirms the request after payment review.</div></form></aside></div></section>`;
  SerendibBookingUI.wirePaymentToggle('pkgPay');
  document.getElementById('packageBooking').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('pkgMsg');try{const method=document.querySelector('input[name="pkgPayMethod"]:checked')?.value||'SLIP';await SerendibBookingUI.createAndPay({bookingType:'PACKAGE',itemId:p.id,startDate:document.getElementById('pkgDate').value,guests:Number(document.getElementById('pkgGuests').value)||1,customerNote:document.getElementById('pkgNote').value.trim()},method,document.getElementById('pkgPaySlip').files[0],msg);e.target.querySelector('button[type=submit]').disabled=true;}catch(err){msg.className='notice error';msg.textContent=err.message;}});
}
loadPackage();
</script></body></html>
