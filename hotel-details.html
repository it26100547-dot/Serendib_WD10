<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Hotel Details | Serendib</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="css/style.css">
</head>
<body class="global-video-page">
    <video class="global-bg-video" autoplay muted loop playsinline aria-hidden="true"><source src="hotel.mp4" type="video/mp4"></video>
    <div class="global-bg-overlay">
    </div>
    <div id="siteHeader">
    </div>
    <main id="detailRoot">
        <section class="section">
            <div class="container">
                <div class="notice">Loading hotel...</div>
            </div>
        </section>
    </main>
    <div id="siteFooter">
    </div><script src="js/data.js"></script><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/booking-ui.js"></script><script>
    const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function roomObj(r){return Array.isArray(r)?{name:r[0],capacity:r[1],price:r[2],description:r[3],image:r[4]}:r;}
    async function loadHotel(){const id=qs('id');let h;try{h=(await SerendibApi.hotels.getById(id)).data;}catch(e){h=DATA.hotels.find(x=>x.id==id)||DATA.hotels[0];}if(!h)return;document.title=`${h.name} | Serendib`;const rooms=(h.rooms||[]).map(roomObj);const imgs=[h.image,...(h.images||[]),...rooms.map(r=>r.image)].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).slice(0,5);while(imgs.length<3)imgs.push(imgs[0]||'assets/images/hero-sigiriya-aerial.jpg');document.getElementById('detailRoot').innerHTML=`
    <section class="detail-hero"><div class="detail-gallery">${imgs.map((im,i)=>`<img class="${i===0?'main':''}" src="${safe(im)}" alt="${safe(h.name)}">`).join('')}</div><div class="detail-summary"><span class="eyebrow">${safe(h.destination||'Sri Lanka')} · ${'★'.repeat(Math.max(1,Math.min(5,h.stars||4)))}</span><h1>${safe(h.name)}</h1><p>${safe(h.description||h.summary||'')}</p><div class="summary-box"><div class="summary-item"><span>RATING</span><strong>★ ${safe(h.rating||'-')}</strong></div><div class="summary-item"><span>FROM</span><strong>${money(h.fromPrice||h.from||0)} / night</strong></div><div class="summary-item"><span>CHECK IN</span><strong>${safe(h.checkIn||'14:00')}</strong></div><div class="summary-item"><span>CHECK OUT</span><strong>${safe(h.checkOut||'11:00')}</strong></div></div></div></section>
    <section class="section"><div class="container detail-grid"><div><div class="panel"><h2>Room types</h2><div class="cards compact-cards">${rooms.map(r=>`<article class="card">${r.image?`<div class="card-media"><img src="${safe(r.image)}" alt="${safe(r.name)}"></div>`:''}<div class="card-body"><span class="eyebrow">${safe(r.name)}</span><h3>${safe(r.capacity||2)} guests</h3><p>${safe(r.description||'Comfortable room available for your selected dates.')}</p><div class="price">${money(r.price)} / night</div></div></article>`).join('')||'<p>No room types added yet.</p>'}</div></div><div class="two-detail-panels"><div class="panel"><h3>Amenities</h3>${(h.amenities||[]).length?`<ul class="detail-list">${h.amenities.map(a=>`<li>${safe(a)}</li>`).join('')}</ul>`:'<p>Not specified.</p>'}</div><div class="panel"><h3>Hotel information</h3><p><strong>Address:</strong> ${safe(h.address||h.destination||'Sri Lanka')}</p><p style="margin-top:10px"><strong>Contact:</strong> ${safe(h.contactPhone||'Contact through Serendib')}</p><p style="margin-top:10px"><strong>Cancellation:</strong> ${safe(h.cancellationPolicy||'Contact Serendib for cancellation terms.')}</p></div></div></div><aside><form class="panel sticky booking-panel" id="hotelBooking"><h3>Book this hotel</h3><div class="field"><label>ROOM TYPE</label><select id="hotelRoom">${rooms.map(r=>`<option value="${safe(r.name)}">${safe(r.name)} — ${money(r.price)}/night</option>`).join('')}</select></div><div class="field"><label>CHECK IN</label><input id="hotelIn" type="date" required></div><div class="field"><label>CHECK OUT</label><input id="hotelOut" type="date" required></div><div class="field"><label>GUESTS</label><input id="hotelGuests" type="number" value="2" min="1" required></div>${SerendibBookingUI.paymentFields('hotelPay')}<button class="btn btn-primary" style="width:100%;margin-top:15px" type="submit">Book room & submit payment</button><div class="notice" id="hotelMsg">The backend calculates the total from the selected room and number of nights.</div></form></aside></div></section>`;SerendibBookingUI.wirePaymentToggle('hotelPay');document.getElementById('hotelBooking').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('hotelMsg');try{const method=document.querySelector('input[name="hotelPayMethod"]:checked')?.value||'SLIP';await SerendibBookingUI.createAndPay({bookingType:'HOTEL',itemId:h.id,optionName:document.getElementById('hotelRoom').value,startDate:document.getElementById('hotelIn').value,endDate:document.getElementById('hotelOut').value,guests:Number(document.getElementById('hotelGuests').value)||1},method,document.getElementById('hotelPaySlip').files[0],msg);e.target.querySelector('button[type=submit]').disabled=true;}catch(err){msg.className='notice error';msg.textContent=err.message;}});}
    loadHotel();
</script></body>
</html>
