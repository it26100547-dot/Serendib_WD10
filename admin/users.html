<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Users | Serendib</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body" data-admin-type="users">
<div class="admin-layout">
    <aside class="sidebar">
        <a class="brand" href="../index.html"><span class="brand-mark">S</span><span>Serendib Admin</span></a>
        <nav class="sidebar-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="packages.html">Packages</a>
            <a href="destinations.html">Destinations</a>
            <a href="transport.html">Transport</a>
            <a href="hotels.html">Hotels</a>
            
            <a href="bookings.html">Bookings</a>
            <a href="users.html" class="active">Users</a>
            <a href="../index.html">Public Site</a>
        </nav>
    </aside>
    <main class="admin-main">
        <div class="admin-top">
            <div>
                <span class="eyebrow">USER CRUD</span>
                <h1>Users &amp; Accounts</h1>
            </div>
            <button class="btn btn-primary" onclick="openModal()">+ Add New User</button>
        </div>
        <div class="table-card">
            <div class="table-toolbar">
                <strong>Manage Users</strong>
                <span style="font-size:12px;color:#777">Directly synced with users.txt in Notepad NoSQL storage.</span>
            </div>
            <div class="table-wrap">
                <table id="adminTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Email / Details</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal for User Add / Edit -->
<div class="modal" id="crudModal">
    <div class="modal-card">
        <div class="modal-head">
            <h2>Add / Edit User</h2>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <form id="crudForm" class="form-grid">
            <input type="hidden" id="editIndex">
            <div class="field">
                <label>FULL NAME</label>
                <input id="itemName" required placeholder="Kasun Silva">
            </div>
            <div class="field">
                <label>ROLE</label>
                <select id="itemCategory">
                    <option value="TRAVELER">TRAVELER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>
            <div class="field full">
                <label>EMAIL ADDRESS</label>
                <input id="itemDescription" type="email" required placeholder="user@example.com">
            </div>
            <div class="full">
                <button class="btn btn-primary">Save User</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
