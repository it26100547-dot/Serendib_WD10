# Spring Boot server
server.port=8080
spring.application.name=serendib-tourism-student

# JSON text-file database folder
serendib.database.dir=data/notepad-database

# Uploaded images and payment slips
serendib.upload.dir=data/uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Frontend files packaged inside the application
spring.web.resources.static-locations=file:./,classpath:/static/
