<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Destinations | Serendib</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
    >

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body class="global-video-page">

<!-- Global cinematic background video -->
<video
        class="global-bg-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
>
    <source src="DESTINATION.mp4" type="video/mp4">
    <source src="/DESTINATION.mp4" type="video/mp4">
</video>

<div class="global-bg-overlay" aria-hidden="true"></div>

<div id="siteHeader"></div>

<main>

    <section class="page-hero">
        <div class="container">

                <span class="eyebrow">
                    Explore every region
                </span>

            <h1>Destinations</h1>

            <p>
                Browse destinations independently, then later connect each one
                to attractions, packages, hotels and transport.
            </p>

        </div>
    </section>

    <section class="section">
        <div class="container">

            <div
                    class="cards"
                    id="destinationList"
            ></div>

        </div>
    </section>

</main>

<div id="siteFooter"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>

<script>
    function renderDestinations(items) {
        document.getElementById("destinationList").innerHTML =
            items.map(destinationCard).join("");
        wireWishlist();
    }

    // Initial render
    renderDestinations(DATA.destinations);

    // Dynamic fetch from Spring Boot REST API
    if (window.SerendibApi) {
        SerendibApi.destinations.getAll()
            .then(res => {
                if (res && res.data) {
                    renderDestinations(res.data);
                }
            })
            .catch(err => console.info('[Destinations] Backend dynamic fetch skipped:', err.message));
    }
</script>

</body>
</html>
