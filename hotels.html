<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Hotels | Serendib</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
    >

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body class="global-video-page">

<!-- Global cinematic background video -->
<video
        class="global-bg-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
>
    <source src="hotel.mp4" type="video/mp4">
    <source src="/hotel.mp4" type="video/mp4">
</video>

<div class="global-bg-overlay" aria-hidden="true"></div>

<div id="siteHeader"></div>

<main>

    <section class="page-hero">
        <div class="container">

                <span class="eyebrow">
                    Find your stay
                </span>

            <h1>Hotels</h1>

            <p>
                Hotel and room information are separated so room types,
                prices and availability can later be managed through
                CRUD operations.
            </p>

        </div>
    </section>

    <section class="section">
        <div class="container">

            <div
                    class="cards"
                    id="hotelList"
            ></div>

        </div>
    </section>

</main>

<div id="siteFooter"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>

<script>
    function renderHotels(items) {
        document.getElementById("hotelList").innerHTML =
            items.map(hotelCard).join("");
        wireWishlist();
    }

    renderHotels(DATA.hotels);

    if (window.SerendibApi) {
        SerendibApi.hotels.getAll()
            .then(res => {
                if (res && res.data) renderHotels(res.data);
            })
            .catch(err => console.info('[Hotels] Backend dynamic fetch skipped:', err.message));
    }
</script>

</body>
</html>
